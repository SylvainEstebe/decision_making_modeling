[project]
name = "conditional-cooperation"
version = "0.1.0"
description = "Bayesian hierarchical analysis of how national (in)security shapes conditional cooperation in the Public Goods Game (Herrmann, Thöni & Gächter, 2008)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sylvain Estebe", email = "sylvain.estebe@gmail.com" },
]
keywords = [
    "bayesian",
    "pymc",
    "cognitive-science",
    "public-goods-game",
    "conditional-cooperation",
    "mcmc",
]
requires-python = ">=3.12"
dependencies = [
    "pymc>=5.16",
    "arviz>=0.20",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbstripout>=0.7",
]

[project.scripts]
cc-fit-worry = "conditional_cooperation.scripts.fit_worry:main"
cc-fit-experience = "conditional_cooperation.scripts.fit_experience:main"
cc-recovery = "conditional_cooperation.scripts.run_recovery:main"

[project.urls]
Repository = "https://github.com/SylvainEstebe/decision_making_project"
Issues = "https://github.com/SylvainEstebe/decision_making_project/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conditional_cooperation"]

# ─── Ruff ──────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy_r", "notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "NPY", # numpy
    "PD",  # pandas
]
ignore = [
    "E501",  # line length handled by formatter
    "PD901", # df as variable name is fine
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers -m 'not slow'"
markers = [
    "slow: marks tests that run NUTS sampling (deselected by default; opt-in with `-m slow`).",
]
